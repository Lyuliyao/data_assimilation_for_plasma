# Test 1 PHASE-ERROR + 3-channel combined nudge (ablation row).
#
# Pairs with test1_phase_error_combined5.yaml. The two configs differ only
# in whether the second-derivative channels (p2d, v2d) and the corresponding
# time_second_derivative observation are active. This config has them OFF.
#
# Channels here: ps + pd + vd (Phase C 3-channel pattern).
# Observation here: phi + d_t phi (no d_t^2 phi).
#
# Hypothesis being tested: for IC pairs where ⟨v⟩ matches between truth
# and assim (this case: both are u=0), the first-time-derivative channels
# alone should already saturate at the shot-noise floor — the d2tobs
# additions in combined5 should be a redundant ~no-op. If e_f here is
# essentially the same as test1_phase_error_combined5's best cell, the
# extra two channels are paying their own keep only on the cases where
# ⟨v²⟩ or higher moments truly differ.

name: test1_phase_error_combined

seed: 0

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: perturbed_maxwellian
  alpha: 1.0e-3
  sigma: 1.0

assim_ic:
  kind: ic_phase_error
  alpha: 1.0e-3
  theta0: 0.5

pic:
  Nx: 128
  Np: 1000000
  dt: 1.0e-2
  n_steps: 4000
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier
  time_derivative:
    enabled: true
    alpha: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    j_source: continuity
  # time_second_derivative explicitly omitted — disables d2tobs observation.

nudge:
  position_snapshot:
    enabled: true
    gamma: 1.0
  position_dtobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  velocity_dtobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  # position_d2tobs and velocity_d2tobs explicitly omitted — disables both
  # d2tobs nudge channels. This is the ps + pd + vd 3-channel ablation.
  lowpass_k_cut_frac: 0.40
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
