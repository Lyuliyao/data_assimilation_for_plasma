# Test 1 — linear Landau damping, *temperature-error* assim IC (eq. 17).
#
# Same truth as `test1_linear_landau.yaml` (weakly-perturbed Maxwellian,
# α=1e-3, k=0.5), but the assimilated run starts from a Maxwellian with
# σ₀ = 1.2 instead of 1.0. This probes whether φ-only observation can recover
# the hidden temperature mismatch — the expected damping rate γ_L(k, T)
# depends on σ, so the residual (φ_f − y) contains information about σ
# even though ρ matches at t=0.

name: test1_landau_temperature

seed: 0

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: perturbed_maxwellian
  alpha: 1.0e-3
  sigma: 1.0

assim_ic:
  kind: ic_temperature_error
  alpha: 1.0e-3
  sigma0: 1.2

pic:
  Nx: 128
  Np: 1000000
  dt: 1.0e-2
  n_steps: 4000
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier

nudge:
  variant: velocity
  gamma: 1.0
  lowpass_k_cut_frac: 0.25
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
