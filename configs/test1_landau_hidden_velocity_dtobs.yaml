# Test 1 hidden-velocity + time-derivative observation (Phase B).
# Mirrors configs/test1_landau_hidden_velocity.yaml plus the augmented
# observation channel from docs/time_derivative_observation_plan.md.
#
# Snapshot result on this config: e_f frozen at 0.6745 across all three
# variants - the bimodal velocity structure of the assim IC is invisible
# to potential-only snapshot observation (linear regime, no nonlinear
# mixing). This is the strongest test for the new mechanism: any
# measurable drop in e_f vs the snapshot floor is a real velocity-space
# recovery from a strictly v-independent observable.

name: test1_landau_hidden_velocity_dtobs

seed: 0

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: perturbed_maxwellian
  alpha: 1.0e-3
  sigma: 1.0

assim_ic:
  kind: ic_hidden_velocity
  alpha: 1.0e-3
  u0: 1.0

pic:
  Nx: 128
  Np: 1000000
  dt: 1.0e-2
  n_steps: 4000
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier
  time_derivative:
    enabled: true
    alpha: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    j_source: continuity

nudge:
  variant: velocity
  gamma: 1.0
  lowpass_k_cut_frac: 0.25
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
