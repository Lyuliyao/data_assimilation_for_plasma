# Test 0 — identifiability, STABLE regime.
# See docs/test0_next_steps.md §2 for the parameter rationale.
#
# Same nonlinear amplitude as the strong config, but u0 = 2.0 pushes the
# two-stream ICs into a cleanly stable regime (both ICs damp, with different
# rates). This is the milder-but-cleaner identifiability comparison: the
# residual e_f(t) should plateau at a well-defined floor rather than riding
# on the back of a marginal instability.

name: test0_identifiability_stable

seed: 0

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: two_peak_velocity
  alpha: 0.5
  u0: 2.0           # clearly stable (Penrose-stable for single-humped u-marginal)

assim_ic:
  kind: perturbed_maxwellian
  alpha: 0.5
  sigma: 1.0

pic:
  Nx: 128
  Np: 1000000
  dt: 1.0e-2
  n_steps: 4000
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier

nudge:
  variant: velocity
  gamma: 1.0
  lowpass_k_cut_frac: 0.40
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
