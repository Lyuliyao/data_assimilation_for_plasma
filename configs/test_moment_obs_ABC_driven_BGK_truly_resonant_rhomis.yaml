name: test_moment_obs_ABC_driven_BGK_truly_resonant_rhomis
seed: 0

# Variant of test_moment_obs_ABC_driven_BGK_truly_resonant.yaml with
# the IC mismatch widened to include DENSITY too. The base config had
# the assim IC differ from truth only in (u, T); this one adds a 30%
# cosine modulation at the fundamental wavenumber k=0.5, which is
# DIFFERENT from the driver wavelength k_d=1.0, so the rho-mismatch
# is not fully cleaned up by being in the driver's basin.
#
# Expected effect: e_rho for "none" should now be visibly larger than
# A/B/C (vs the base config where they were nearly tied because the
# IC density was already correct).

domain:
  k: 0.5
  v_min: -12.0
  v_max: 12.0

truth_ic:
  kind: perturbed_maxwellian
  alpha: 1.0e-2
  sigma: 1.0

assim_ic:
  kind: wrong_maxwellian
  rho_amp: 0.3        # 30% density modulation at k=0.5 (was 0.0 in the base config)
  u_star: 0.3
  T_star: 1.5

pic:
  Nx: 128
  Np: 500000
  dt: 0.05
  n_steps: 1000
  backend: reference

collision:
  kind: bgk
  nu: 0.05
  rho_floor: 1.0e-3
  T_floor: 1.0e-3

driver:
  kind: off_resonance_wave
  E0: 0.2
  k_d: 1.0
  omega_d: 2.0

moment_observation:
  kind: full
  every_q: 10
  rng_seed: 0

moment_nudge:
  formulation: A
  A:
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    V_star: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
  B:
    gamma_x: 1.0
    gamma_v: 1.0
    gamma_1: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
  C:
    lam: 1.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: ../results
