# Test 0 LINEAR + 5-channel combined nudge (Phase D3 smoke).
# Quick interactive runtime to sanity-check the position_d2tobs path
# doesn't NaN. Real acceptance is on asymmetric / strong via SLURM.

name: test0_identifiability_linear_combined5

seed: 0

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: two_peak_velocity
  alpha: 1.0e-3
  u0: 1.5

assim_ic:
  kind: perturbed_maxwellian
  alpha: 1.0e-3
  sigma: 1.0

pic:
  Nx: 128
  Np: 200000
  dt: 1.0e-2
  n_steps: 2000
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier
  time_derivative:
    enabled: true
    alpha: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    j_source: continuity
  time_second_derivative:
    enabled: true
    lowpass_k_cut_frac: 0.15
    lowpass_sharpness: 16.0

nudge:
  position_snapshot:
    enabled: true
    gamma: 1.0
  position_dtobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  position_d2tobs:
    enabled: true
    gamma: 1.0
    alpha: 0.01   # h3 noise -> aggressive damping; tune up after stable
  velocity_dtobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  velocity_d2tobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  lowpass_k_cut_frac: 0.25
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
