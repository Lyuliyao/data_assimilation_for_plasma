name: test_moment_obs_ABC_driven_BGK_2D_ic_T_continuous
seed: 0

# 2D2V temperature-mismatch IC + continuous oblique driver.
# Companion to test_moment_obs_ABC_driven_BGK_2D_ic_drift_continuous: same
# driver, but the IC mismatch is in T instead of u. Because the Bohm-Gross
# frequency depends on T (omega_BG^2 = 1 + 3 |k|^2 T), truth (T=1) and
# assim (T=1.5) build different driven responses to the same F_ext --
# persistent mismatch in the *energy* residual r_2 (and indirectly in r_0
# via dispersion). Weak BGK keeps T from relaxing on the run timescale.
#
# Domain and driver identical to the drift case (omega is set to the
# truth-side BG resonance at T=1, so truth is on-resonance and assim is
# off-resonance with effective BG-T=1.5 frequency sqrt(1 + 6*1.5) ~ 3.16).

domain:
  kx: 1.0
  ky: 1.0

truth_ic:
  kind: wrong_maxwellian_2d
  rho_amp: 0.0
  ux_star: 0.0
  uy_star: 0.0
  T_star: 1.0

assim_ic:
  kind: wrong_maxwellian_2d
  rho_amp: 0.0
  ux_star: 0.0
  uy_star: 0.0
  T_star: 1.5

pic:
  Nx: 64
  Ny: 64
  Np: 200000
  dt: 0.05
  n_steps: 2000                  # T = 100

collision:
  kind: bgk
  nu: 0.005
  rho_floor: 1.0e-3
  T_floor: 1.0e-3

driver:
  kind: oblique_traveling_continuous
  A: 0.2
  kx_d: 1.0
  ky_d: 1.0
  omega: 2.6457513110645907      # BG at |k|=sqrt(2), T=1 (truth-resonant)
  ramp_time: 2.0
  theta: 0.0

moment_observation:
  kind: full
  every_q: 10
  rng_seed: 0

moment_nudge:
  formulation: A_var
  A_var:
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3
  B:
    gamma: 1.0
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3

diagnostics:
  every_diag_steps: 10

outputs_dir: results
