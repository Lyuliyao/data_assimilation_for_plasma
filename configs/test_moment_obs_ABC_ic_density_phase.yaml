name: test_moment_obs_ABC_ic_density_phase
seed: 0

# IC mismatch test #1: density phase mismatch (no F_ext, no T/u mismatch).
#
# truth: rho(x,0) = 1 + 0.1 cos(k x),       u_0 = 0, T_0 = 1.
# model: rho(x,0) = 1 + 0.1 cos(k x + pi),  u_0 = 0, T_0 = 1.
#                = 1 - 0.1 cos(k x)
#
# Same amplitude wave, exactly pi out of phase. With no driver, both
# waves Bohm-Gross-oscillate at omega ~ 1.32 and damp under BGK +
# Landau. Without nudging, e_rho will decay naturally as both waves
# vanish — the real test is whether A/B/C inject the right
# anti-phase correction in the early transient.

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: perturbed_maxwellian
  alpha: 0.1
  sigma: 1.0

assim_ic:
  kind: ic_phase_error
  alpha: 0.1
  theta0: 3.141592653589793   # pi — maximum phase mismatch

pic:
  Nx: 128
  Np: 500000
  dt: 0.05
  n_steps: 1000             # t = 0 -> 50  (~10 Langmuir periods)
  backend: reference

collision:
  kind: bgk
  nu: 0.05
  rho_floor: 1.0e-3
  T_floor: 1.0e-3

driver:
  kind: none                # F_ext = 0 (identical on both sides, here zero)

moment_observation:
  kind: full
  every_q: 10
  rng_seed: 0

moment_nudge:
  formulation: A
  A:
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    V_star: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
  A_var:
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3
  B:
    gamma: 1.0
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3
  C:
    lam: 1.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: ../results
