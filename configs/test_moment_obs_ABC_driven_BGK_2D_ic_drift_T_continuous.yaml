name: test_moment_obs_ABC_driven_BGK_2D_ic_drift_T_continuous
seed: 0

# Combined velocity-drift + temperature-mismatch IC, continuous oblique driver.
# Both r_1 (current) and r_2 (energy) residuals are persistently activated,
# stressing every channel of the moment-loss nudging at once. Less clean
# than the single-mode cases (drift_continuous, T_continuous) for
# diagnostic interpretation, but a robust third case for confirming the
# 5-way ranking observed there.
#
# Domain and driver identical to the two single-mode cases.

domain:
  kx: 1.0
  ky: 1.0

truth_ic:
  kind: wrong_maxwellian_2d
  rho_amp: 0.0
  ux_star: 0.0
  uy_star: 0.0
  T_star: 1.0

assim_ic:
  kind: wrong_maxwellian_2d
  rho_amp: 0.0
  ux_star: 0.17677669529663687    # 0.25 / sqrt(2)
  uy_star: 0.17677669529663687
  T_star: 1.3

pic:
  Nx: 64
  Ny: 64
  Np: 200000
  dt: 0.05
  n_steps: 2000                   # T = 100

collision:
  kind: bgk
  nu: 0.005
  rho_floor: 1.0e-3
  T_floor: 1.0e-3

driver:
  kind: oblique_traveling_continuous
  A: 0.2
  kx_d: 1.0
  ky_d: 1.0
  omega: 2.6457513110645907       # BG at |k|=sqrt(2), T=1 (truth-resonant)
  ramp_time: 2.0
  theta: 0.0

moment_observation:
  kind: full
  every_q: 10
  rng_seed: 0

moment_nudge:
  formulation: A_var
  A:
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    V_star: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
  A_var:
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3
  B:
    gamma: 1.0
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3
  C:
    lam: 1.0
    use_weighted_metric: true
    V_star: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3

diagnostics:
  every_diag_steps: 10

outputs_dir: results
