# Best-cell of the (Np, beta) sweep on phase_error_combined5:
# Np=1e6, position_d2tobs.alpha = 0.01. The success-tier baseline —
# both 3-ch and 5-ch saturate near e_f ~ 0.085. Used as the
# visualisation reference for what a fully-identifiable IC looks like.

name: test1_phase_error_combined5_best

seed: 0

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: perturbed_maxwellian
  alpha: 1.0e-3
  sigma: 1.0

assim_ic:
  kind: ic_phase_error
  alpha: 1.0e-3
  theta0: 0.5

pic:
  Nx: 128
  Np: 1000000
  dt: 1.0e-2
  n_steps: 4000
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier
  time_derivative:
    enabled: true
    alpha: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    j_source: continuity
  time_second_derivative:
    enabled: true
    lowpass_k_cut_frac: 0.15
    lowpass_sharpness: 16.0

nudge:
  position_snapshot:
    enabled: true
    gamma: 1.0
  position_dtobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  position_d2tobs:
    enabled: true
    gamma: 1.0
    alpha: 0.01
  velocity_dtobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  velocity_d2tobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  lowpass_k_cut_frac: 0.25
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
