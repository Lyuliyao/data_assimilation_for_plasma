# Best cell of the (Np, beta) sweep on linear_combined5:
# Np=1e6, position_d2tobs.alpha = 0.3.
# This is the first config in the campaign where e_f drops below the
# snapshot baseline of 1.219 (lands at 1.2115) AND mode-1 tracks truth
# to within 1%.

name: test0_identifiability_linear_combined5_best

seed: 0

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: two_peak_velocity
  alpha: 1.0e-3
  u0: 1.5

assim_ic:
  kind: perturbed_maxwellian
  alpha: 1.0e-3
  sigma: 1.0

pic:
  Nx: 128
  Np: 1000000        # 5x linear5 default; lifts the beta stability boundary
  dt: 1.0e-2
  n_steps: 2000
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier
  time_derivative:
    enabled: true
    alpha: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    j_source: continuity
  time_second_derivative:
    enabled: true
    lowpass_k_cut_frac: 0.15
    lowpass_sharpness: 16.0

nudge:
  position_snapshot:
    enabled: true
    gamma: 1.0
  position_dtobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  position_d2tobs:
    enabled: true
    gamma: 1.0
    alpha: 0.3       # the optimum found by the (Np, beta) sweep
  velocity_dtobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  velocity_d2tobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  lowpass_k_cut_frac: 0.25
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
