name: test_moment_obs_ABC_driven_BGK_ic_mismatch_wavepacket
seed: 0

# Gaussian-windowed traveling wave driver + density-phase IC mismatch.
#
# F_ext(x, t) = E0 * exp(-(t - t0)^2 / (2 sigma_t^2)) sin(k_d x - omega_d t + theta)
#
# Parameters per user's recipe (T = 100):
#   k_d   = 1.0
#   omega = 1.0  (near omega_p; below Bohm-Gross at omega = 2 for k=1, T=1)
#   E0    = 0.05  (upper end of suggested 0.02-0.05 range)
#   t0    = 35    (= 0.35 T)
#   sigma_t = 12  (= 0.12 T)  -> pulse FWHM ~ 28 t.u., spans t in [11, 59]
#
# IC mismatch: same density anti-phase as v2 / chirp configs
#   (alpha = 0.3, theta0 = pi).
#
# Visual story: quiet background -> wave packet drives a coherent
# Langmuir-like response -> packet ends -> quiet background.
# All formulations should track the same packet response; the question
# is whether they converge BEFORE the packet hits, DURING, or AFTER.

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: perturbed_maxwellian
  alpha: 0.3
  sigma: 1.0

assim_ic:
  kind: ic_phase_error
  alpha: 0.3
  theta0: 3.141592653589793

pic:
  Nx: 128
  Np: 500000
  dt: 0.05
  n_steps: 2000              # T = 100
  backend: reference

collision:
  kind: bgk
  nu: 0.01
  rho_floor: 1.0e-3
  T_floor: 1.0e-3

driver:
  kind: wavepacket
  E0: 0.05
  k_d: 1.0
  omega_d: 1.0
  t0: 35.0
  sigma_t: 12.0
  theta: 0.0

moment_observation:
  kind: full
  every_q: 10
  rng_seed: 0

moment_nudge:
  formulation: A
  A:
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    V_star: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
  A_var:
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3
  B:
    gamma: 1.0
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3
  C:
    lam: 1.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: ../results
