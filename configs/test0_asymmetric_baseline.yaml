# Snapshot baseline on the asymmetric truth IC. Same numerics as
# test0_asymmetric_combined.yaml but with the legacy single-variant nudge
# block, so compare_velocity_vs_position.py runs none/velocity/position.
name: test0_asymmetric_baseline
seed: 0
domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0
truth_ic:
  kind: asymmetric_two_peak
  alpha: 0.5
  u_pos: 1.5
  u_neg: -1.0
  w_pos: 0.5
assim_ic:
  kind: perturbed_maxwellian
  alpha: 0.5
  sigma: 1.0
pic:
  Nx: 128
  Np: 1000000
  dt: 1.0e-2
  n_steps: 4000
  backend: reference
observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier
nudge:
  variant: velocity
  gamma: 1.0
  lowpass_k_cut_frac: 0.40
  lowpass_sharpness: 16.0
diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10
outputs_dir: results
