# Test 0 — identifiability sanity check, LINEAR / weak-perturbation regime.
# See docs/test0_next_steps.md for the three-regime setup (linear/strong/stable).
#
# Two initial distributions share the same spatial density rho_0 but different
# velocity marginals (single Maxwellian vs. two opposite drifts). A single
# potential snapshot cannot distinguish them; the time history can only
# partially distinguish them. With nudging OFF the two potential fields
# diverge; with nudging ON the residual e_f(t) asymptotes to the identifiability
# floor. The scientific deliverable of Test 0 is that floor, not recovery.
#
# At alpha=1e-3, u0=1.5, T=20 the nonlinear coupling is negligible and the
# Landau-vs-marginal-two-stream signal sits near the PIC shot-noise level, so
# this config is the weak-demonstration reference. See test0_identifiability_
# strong.yaml and test0_identifiability_stable.yaml for the richer regimes.

name: test0_identifiability_linear

seed: 0

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: two_peak_velocity
  alpha: 1.0e-3
  u0: 1.5        # drift magnitude of the two streams

assim_ic:
  kind: perturbed_maxwellian
  alpha: 1.0e-3
  sigma: 1.0

pic:
  Nx: 128
  Np: 200000      # modest particle count for a quick iteration
  dt: 1.0e-2
  n_steps: 2000   # T = 20 plasma periods
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1      # observe every step
  reconstruction: fourier

nudge:
  variant: velocity
  gamma: 1.0
  lowpass_k_cut_frac: 0.25
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
