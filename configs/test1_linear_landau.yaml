# Test 1 — linear Landau damping (section 1.2 of the note).
#
# Truth: weakly perturbed Maxwellian, alpha = 1e-3, k = 0.5.
# Assimilated IC: phase-shifted Maxwellian (eq. 16) to probe phase-error
# recovery. Swap `assim_ic.kind` to `ic_temperature_error` (eq. 17) or
# `ic_hidden_velocity` (eq. 18) to probe temperature or hidden-velocity
# recovery respectively.

name: test1_linear_landau

seed: 0

domain:
  k: 0.5           # also try 0.3
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: perturbed_maxwellian
  alpha: 1.0e-3
  sigma: 1.0

assim_ic:
  kind: ic_phase_error
  alpha: 1.0e-3
  theta0: 0.5      # initial phase error in radians

pic:
  Nx: 128
  Np: 1000000      # 1e6 as in the note; reduce to 2e5 for quick smoke
  dt: 1.0e-2
  n_steps: 4000    # T = 40; exponential damping is fully resolved
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier

nudge:
  variant: velocity
  gamma: 1.0
  lowpass_k_cut_frac: 0.25
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
