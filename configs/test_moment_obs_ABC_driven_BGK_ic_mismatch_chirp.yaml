name: test_moment_obs_ABC_driven_BGK_ic_mismatch_chirp
seed: 0

# Chirped traveling-wave driver + density-phase IC mismatch.
#
# F_ext(x, t) = E0 * sin(k_d x - omega_0 t - 0.5 beta t^2 + theta)
# Instantaneous frequency omega(t) = omega_0 + beta t.
#
# k_d = 1, omega_0 = 0.75, omega(T=100) = 1.25  =>  beta = 0.005.
# The chirp passes through omega_p = 1 (cold-plasma resonance) at t = 50.
# Bohm-Gross at k=1 (T=1) is omega = 2, so we don't reach BG resonance,
# but the chirp creates a visibly bending striation pattern in phase space.
#
# IC: same density anti-phase mismatch as ic_density_phase_v2
# (truth +0.3 cos kx, model -0.3 cos kx). Tests whether ABC tracks both
# the IC mismatch and the chirped driven response.

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: perturbed_maxwellian
  alpha: 0.3
  sigma: 1.0

assim_ic:
  kind: ic_phase_error
  alpha: 0.3
  theta0: 3.141592653589793

pic:
  Nx: 128
  Np: 500000
  dt: 0.05
  n_steps: 2000              # T = 100
  backend: reference

collision:
  kind: bgk
  nu: 0.01
  rho_floor: 1.0e-3
  T_floor: 1.0e-3

driver:
  kind: chirped_wave
  E0: 0.2
  k_d: 1.0
  omega_0: 0.75
  beta: 0.005                # (omega(T) - omega_0) / T = 0.5 / 100
  theta: 0.0

moment_observation:
  kind: full
  every_q: 10
  rng_seed: 0

moment_nudge:
  formulation: A
  A:
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    V_star: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
  A_var:
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3
  B:
    gamma: 1.0
    gamma_1: 1.0
    gamma_2: 1.0
    gamma_3: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3
  C:
    lam: 1.0
    rho_floor: 1.0e-3
    T_floor: 1.0e-3

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: ../results
