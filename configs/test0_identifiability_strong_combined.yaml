# Test 0 STRONG + combined nudge (Phase C — primary acceptance config).
# Mirrors test0_identifiability_strong.yaml plus the full eqs. 17-18 of
# docs/combined_nudge_amendment.md.
#
# Acceptance gate: e_f < 0.7 at gamma=1, alpha=1, single seed.
# Reference floors on this regime:
#   snapshot position : e_phi=0.008  e_f=0.777
#   velocity_dtobs    : e_phi=0.021  e_f=0.937
# The bilinear position_dtobs term is the structural addition expected to
# break through the 0.777 e_f floor.

name: test0_identifiability_strong_combined

seed: 0

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: two_peak_velocity
  alpha: 0.5
  u0: 1.2

assim_ic:
  kind: perturbed_maxwellian
  alpha: 0.5
  sigma: 1.0

pic:
  Nx: 128
  Np: 1000000
  dt: 1.0e-2
  n_steps: 4000
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier
  time_derivative:
    enabled: true
    alpha: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    j_source: continuity

nudge:
  position_snapshot:
    enabled: true
    gamma: 1.0
  position_dtobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  velocity_dtobs:
    enabled: true
    gamma: 1.0
    alpha: 1.0
  lowpass_k_cut_frac: 0.40
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
