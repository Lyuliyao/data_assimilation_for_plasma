# Test 0 STABLE + time-derivative observation (Phase B).
# Mirrors configs/test0_identifiability_stable.yaml plus the augmented
# observation channel from docs/time_derivative_observation_plan.md.
#
# Snapshot velocity-nudge in this regime: e_phi = 0.073 (gamma=1.0) and
# the gamma-sweep showed the destabilisation band gamma in [0.25, 1.0].
# Position-nudge already pulled e_f from 1.620 -> 1.528. Phase B target:
# alpha > 0 should let velocity-nudge match or beat position-nudge on e_f.

name: test0_identifiability_stable_dtobs

seed: 0

domain:
  k: 0.5
  v_min: -6.0
  v_max: 6.0

truth_ic:
  kind: two_peak_velocity
  alpha: 0.5
  u0: 2.0

assim_ic:
  kind: perturbed_maxwellian
  alpha: 0.5
  sigma: 1.0

pic:
  Nx: 128
  Np: 1000000
  dt: 1.0e-2
  n_steps: 4000
  backend: reference

observation:
  kind: full
  sigma: 0.0
  every_m: 1
  every_q: 1
  reconstruction: fourier
  time_derivative:
    enabled: true
    alpha: 1.0
    lowpass_k_cut_frac: 0.25
    lowpass_sharpness: 16.0
    j_source: continuity

nudge:
  variant: velocity
  gamma: 1.0
  lowpass_k_cut_frac: 0.40
  lowpass_sharpness: 16.0

diagnostics:
  phase_space_Nx: 64
  phase_space_Nv: 64
  fourier_n_modes: 6
  every_diag_steps: 10

outputs_dir: results
